name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyMFEM (`mfem`) is a heavy source-only build, so it is omitted here.
      # `--no-deps` skips it and `triangle`; tests marked `mfem` auto-skip
      # (see tests/conftest.py) and `triangle`-dependent tests importorskip.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml "treeparse>=0.2.5" \
            matplotlib scikit-learn joblib pytest
          pip install -e . --no-deps

      - name: Run tests (mfem-marked tests skipped)
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pre-commit/action@v3.0.1
