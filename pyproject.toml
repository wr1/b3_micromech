[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3-micromech"
version = "0.1.0"
description = "FEA micromechanics homogenization of UD composite transverse RVEs (MFEM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wr1" }]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "treeparse>=0.2.5",
  "mfem",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
viz = ["matplotlib>=3.7"]
sweep = ["joblib>=1.3"]
tex = ["b3-tex"]

[project.scripts]
b3-micromech = "b3_micromech.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_micromech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mfem: requires a working PyMFEM (mfem) installation",
]