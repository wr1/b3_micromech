[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3-micromech"
version = "0.1.0"
description = "FEA micromechanics homogenization of UD composite transverse RVEs (MFEM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wr1" }]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "treeparse>=0.2.5",
  "mfem",
  "triangle",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
viz = ["matplotlib>=3.7"]
sweep = ["joblib>=1.3"]
surrogate = ["scikit-learn>=1.3", "joblib>=1.3"]
tex = ["b3-tex"]

[project.scripts]
b3-micromech = "b3_micromech.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_micromech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mfem: requires a working PyMFEM (mfem) installation",
]

[tool.ruff.lint]
# E741: single-letter names (l, n, m, k, p) match the micromechanics notation.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Examples manipulate sys.path before importing; test_amr guards its mfem
# import with importorskip — both legitimately import below module top.
"examples/*" = ["E402"]
"tests/test_amr.py" = ["E402"]