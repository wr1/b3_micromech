[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "b3-micromech"
version = "0.1.0"
description = "FEA micromechanics homogenization of UD composite transverse RVEs (MFEM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "wr1" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "treeparse>=0.3,<0.4",
  "mfem>=4.8,<4.11",
  "triangle>=20250106",
]

[project.optional-dependencies]
hex-mesh = []  # kept so existing .[hex-mesh] installs keep working; triangle is core
test = ["pytest>=8.0", "pytest-cov>=5"]
viz = ["matplotlib>=3.7"]
sweep = ["joblib>=1.3"]
surrogate = ["scikit-learn>=1.3,<2", "joblib>=1.3"]

[project.scripts]
b3-micromech = "b3_micromech.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_micromech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mfem: requires a working PyMFEM (mfem) installation",
  "b3tex: requires b3_tex; run by the integration CI job",
]
filterwarnings = [
  "error::DeprecationWarning:b3_micromech.*",
]

[tool.coverage.run]
source = ["b3_micromech"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff.lint]
# E741: single-letter names (l, n, m, k, p) match the micromechanics notation.
ignore = ["E741"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# test_amr guards its mfem import with importorskip.
"tests/test_amr.py" = ["E402"]